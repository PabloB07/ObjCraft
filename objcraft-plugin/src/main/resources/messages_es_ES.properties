command.permission.import=&cNo tienes permiso para importar modelos.
command.usage.import=&eUso: /objcraft import <archivo.obj|gltf|glb>
command.import.failure=&cNo se pudo importar: {0}
command.import.success=&aModelo &f{0}&a importado y agregado al resource pack. Usa &f/objcraft spawn {0}&a.
command.import.url_missing=&eConfigura resource-pack.public-url para que los clientes descarguen el pack.
command.models.empty=&eNo hay modelos. Coloca archivos .obj, .gltf o .glb en plugins/ObjCraft/models/
command.models.list=&aModelos disponibles (&f{0}&a): &f{1}
command.spawn.permission=&cNo tienes permiso para mostrar modelos.
command.spawn.player_only=&cEl comando spawn solo puede ejecutarse dentro del juego.
command.spawn.usage=&eUso: /objcraft spawn <modelo>
command.spawn.failure=&cNo se pudo mostrar el modelo: {0}
command.spawn.success=&aMalla 3D de &f{0}&a mostrada (&f{1}&a). Elimina la instancia con &f/objcraft remove {1}&a.
command.remove.permission=&cNo tienes permiso para eliminar modelos.
command.remove.usage=&eUso: /objcraft remove <id-instancia>
command.instance.not_found=&cNo existe una instancia activa con ese ID.
command.remove.failure=&cNo se pudo eliminar: {0}
command.remove.success=&aInstancia &f{0}&a eliminada.
command.reload.permission=&cNo tienes permiso para recargar ObjCraft.
command.reload.usage=&eUso: /objcraft reload
command.reload.start=&eRecargando configuración, modelos y resource pack...
command.reload.failure=&cNo se pudo reconstruir el resource pack: {0}
command.reload.success=&aResource pack reconstruido con &f{0}&a modelo(s). Se enviará a los jugadores conectados.
command.edit.permission=&cNo tienes permiso para editar modelos.
command.edit.usage=&eUso: /objcraft edit <id> <move|rotate|scale|seat> <valores>
command.edit.operation_unknown=&cOperación desconocida. Usa move, rotate, scale o seat.
command.edit.failure=&cNo se pudo editar el modelo: {0}
command.edit.success=&aTransformación de &f{0}&a actualizada.
command.edit.argument_count=&cCantidad incorrecta de valores para esa operación.
command.edit.number=&cUsa números finitos (por ejemplo: 0.5, 1, -2).
command.sit.player_only=&cSolo un jugador puede sentarse en un modelo.
command.sit.permission=&cNo tienes permiso para sentarte en modelos.
command.sit.usage=&eUso: /objcraft sit <id-instancia>
command.sit.failure=&cNo fue posible sentarse: {0}
command.sit.success=&aTe sentaste sobre &f{0}&a. Usa Shift para bajarte.
help.title=&bObjCraft &7- importación y renderizado de mallas OBJ/glTF/GLB
help.reload=&e/objcraft reload &7- recargar configuración, modelos y resource pack
help.edit=&e/objcraft edit <id> move|rotate|scale|seat ... &7- ajustar modelo y punto de asiento
help.sit=&e/objcraft sit <id> &7- sentarte en una instancia
help.list=&e/objcraft list &7- listar modelos disponibles
help.import=&e/objcraft import <modelo> &7- validar e importar un OBJ, glTF o GLB
help.spawn=&e/objcraft spawn <modelo> &7- mostrar la malla 3D texturizada
help.remove=&e/objcraft remove <id-instancia> &7- eliminar el modelo mostrado
pack.declined=ObjCraft: acepta el resource pack para ver las mallas 3D.
pack.download_failed=ObjCraft: no se pudo descargar el pack; avisa al administrador para revisar la URL.
pack.invalid_url=ObjCraft: la URL del resource pack no es válida o no es accesible.
pack.reload_failed=ObjCraft: el cliente descargó el pack pero no pudo cargarlo. Revisa latest.log.
pack.loaded=ObjCraft: resource pack cargado correctamente.
pack.prompt=Modelos 3D de ObjCraft
