command.permission.import=&cYou do not have permission to import models.
command.usage.import=&eUsage: /objcraft import <file.obj|gltf|glb>
command.import.failure=&cCould not import the model: {0}
command.import.success=&aModel &f{0}&a imported and added to the resource pack. Use &f/objcraft spawn {0}&a.
command.import.url_missing=&eSet resource-pack.public-url so clients can download the pack.
command.models.empty=&eNo models found. Put .obj, .gltf, or .glb files in plugins/ObjCraft/models/
command.models.list=&aAvailable models (&f{0}&a): &f{1}
command.spawn.permission=&cYou do not have permission to spawn models.
command.spawn.player_only=&cThe spawn command can only be used in-game.
command.spawn.usage=&eUsage: /objcraft spawn <model>
command.spawn.failure=&cCould not display the model: {0}
command.spawn.success=&a3D mesh &f{0}&a spawned (&f{1}&a). Remove it with &f/objcraft remove {1}&a.
command.remove.permission=&cYou do not have permission to remove models.
command.remove.usage=&eUsage: /objcraft remove <instance-id>
command.instance.not_found=&cNo active instance exists with that ID.
command.remove.failure=&cCould not remove the instance: {0}
command.remove.success=&aInstance &f{0}&a removed.
command.reload.permission=&cYou do not have permission to reload ObjCraft.
command.reload.usage=&eUsage: /objcraft reload
command.reload.start=&eReloading configuration, models, and resource pack...
command.reload.failure=&cCould not rebuild the resource pack: {0}
command.reload.success=&aResource pack rebuilt with &f{0}&a model(s). It will be sent to online players.
command.edit.permission=&cYou do not have permission to edit models.
command.edit.usage=&eUsage: /objcraft edit <id> <move|rotate|scale|seat> <values>
command.edit.operation_unknown=&cUnknown operation. Use move, rotate, scale, or seat.
command.edit.failure=&cCould not edit the model: {0}
command.edit.success=&aTransform for &f{0}&a updated.
command.edit.argument_count=&cIncorrect number of values for that operation.
command.edit.number=&cUse finite numbers (for example: 0.5, 1, -2).
command.sit.player_only=&cOnly a player can sit on a model.
command.sit.permission=&cYou do not have permission to sit on models.
command.sit.usage=&eUsage: /objcraft sit <instance-id>
command.sit.failure=&cCould not sit on the model: {0}
command.sit.success=&aYou are sitting on &f{0}&a. Press Shift to get off.
help.title=&bObjCraft &7- OBJ/glTF/GLB mesh import and rendering
help.reload=&e/objcraft reload &7- reload config, models, and resource pack
help.edit=&e/objcraft edit <id> move|rotate|scale|seat ... &7- adjust model and seat position
help.sit=&e/objcraft sit <id> &7- sit on an instance
help.list=&e/objcraft list &7- list available models
help.import=&e/objcraft import <model> &7- validate and import OBJ, glTF, or GLB
help.spawn=&e/objcraft spawn <model> &7- display a textured 3D mesh
help.remove=&e/objcraft remove <instance-id> &7- remove a displayed model
pack.declined=ObjCraft: accept the resource pack to see 3D meshes.
pack.download_failed=ObjCraft: the pack could not be downloaded. Ask an administrator to check the URL.
pack.invalid_url=ObjCraft: the resource pack URL is invalid or unreachable.
pack.reload_failed=ObjCraft: the client downloaded the pack but could not load it. Check latest.log.
pack.loaded=ObjCraft: resource pack loaded successfully.
